<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>圈速計 v4</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0c;color:#eee;font-family:-apple-system,system-ui,sans-serif;
       -webkit-user-select:none;user-select:none}
  #stage{position:relative;width:100%;background:#000;overflow:hidden}
  video{width:100%;display:block}
  #ovl{position:absolute;inset:0;width:100%;height:100%}
  .panel{padding:12px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  button{background:#26262b;color:#eee;border:1px solid #3a3a42;border-radius:8px;
         padding:9px 14px;font-size:15px}
  button.on{background:#2563eb;border-color:#2563eb}
  button.run{background:#dc2626;border-color:#dc2626}
  button:disabled{opacity:.4}
  #btnStart{font-size:17px;font-weight:600;padding:13px 22px;flex:1}
  #btnCal{background:#7c3aed;border-color:#7c3aed}
  input[type=range]{flex:1;min-width:110px}
  label{font-size:12px;color:#999;min-width:70px}
  .val{font-size:12px;color:#bbb;min-width:46px;text-align:right}
  table{width:100%;border-collapse:collapse;font-size:16px;margin-top:6px}
  th,td{padding:8px 4px;border-bottom:1px solid #26262b;text-align:right}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{font-size:12px;color:#888;font-weight:500}
  .best{color:#4ade80}
  .wait{color:#facc15;font-size:13px}
  .thumb{width:34px;height:34px;object-fit:cover;border-radius:5px;background:#26262b;
         vertical-align:middle;display:inline-block}
  #status{font-size:14px;color:#ddd;padding:10px 12px;background:#161619;border-radius:8px;
          margin:0 12px;line-height:1.45}
  h3{font-size:14px;color:#888;font-weight:600;margin:18px 0 6px;
     text-transform:uppercase;letter-spacing:.05em}
  .hint{font-size:12px;color:#777;line-height:1.5;margin:4px 0 10px}
  #diagBox{display:flex;gap:12px;align-items:flex-start;background:#141418;
           border:1px solid #26262b;border-radius:8px;padding:10px;margin-bottom:10px}
  #dbg{width:72px;height:96px;image-rendering:pixelated;border:1px solid #3a3a42;
       border-radius:4px;background:#000;flex-shrink:0}
  #meter{flex:1}
  .nums{font-size:12px;color:#aaa;font-variant-numeric:tabular-nums;line-height:1.7}
  #blobs{font-size:12px;line-height:1.7;margin-top:4px}
  #evlog{font-size:11px;color:#888;font-family:ui-monospace,monospace;line-height:1.6;
         max-height:120px;overflow-y:auto;margin-top:6px}
</style>
</head>
<body>

<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ovl"></canvas>
</div>

<div id="status">按「開啟相機」開始</div>

<div class="panel">

  <div class="row">
    <button id="btnCam">開啟相機</button>
    <button id="btnBg" disabled>重學背景</button>
    <button id="btnWhite" disabled>白卡校正</button>
  </div>

  <div id="diagBox">
    <canvas id="dbg"></canvas>
    <div id="meter">
      <div class="nums" id="nums">尚未啟動</div>
      <div id="blobs"></div>
    </div>
  </div>

  <div class="row"><button id="btnCal" disabled>自動校準</button></div>
  <div class="hint">按下後有 8 秒，把車來回推過偵測框幾次，程式會量出車體大小並設定門檻。</div>

  <div class="row"><button id="btnStart" disabled>開始計時</button></div>

  <h3>偵測框位置</h3>
  <div class="row"><label>左右</label><input type="range" id="rX" min="3" max="97" value="50"><span class="val" id="vX">50</span></div>
  <div class="row"><label>寬度</label><input type="range" id="rW" min="2" max="40" value="10"><span class="val" id="vW">10</span></div>
  <div class="row"><label>上下</label><input type="range" id="rY" min="3" max="97" value="50"><span class="val" id="vY">50</span></div>
  <div class="row"><label>高度</label><input type="range" id="rH" min="5" max="100" value="50"><span class="val" id="vH">50</span></div>
  <div class="hint">框要蓋住整個賽道寬度（兩台車並排都要在框內），但沿行進方向盡量窄。</div>

  <h3>登錄車輛</h3>
  <div class="hint">按下按鈕後，把車單獨推過框一次。登錄時允許慢慢推。</div>
  <div class="row" id="enroll"></div>

  <h3>成績</h3>
  <table>
    <thead><tr><th>車</th><th></th><th>圈</th><th>本圈</th><th>最快</th></tr></thead>
    <tbody id="tbl"></tbody>
  </table>
  <div class="row" style="margin-top:12px"><button id="btnReset">成績歸零</button></div>

  <h3>事件記錄</h3>
  <div id="evlog"></div>

  <h3>參數</h3>
  <div class="row"><label>前景門檻</label><input type="range" id="pFg" min="20" max="200" value="70"><span class="val" id="vFg">70</span></div>
  <div class="row"><label>最小車體</label><input type="range" id="pArea" min="2" max="200" value="20"><span class="val" id="vArea">2.0%</span></div>
  <div class="row"><label>相似度門檻</label><input type="range" id="pMat" min="20" max="80" value="40"><span class="val" id="vMat">0.40</span></div>
  <div class="row"><label>最短圈速</label><input type="range" id="pLap" min="5" max="60" value="20"><span class="val" id="vLap">2.0s</span></div>

</div>

<script>
'use strict';

/* ================= 顏色指紋 ================= */
const HUE=16, SAT=2, ACHRO=4, NBIN=HUE*SAT+ACHRO;
const sigNew = () => new Float32Array(NBIN);

function sigAdd(sig, r, g, b) {
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), d=mx-Math.min(r,g,b);
  const s = mx>0.004 ? d/mx : 0;
  if (s<0.22){ sig[HUE*SAT+Math.min(ACHRO-1,(mx*ACHRO)|0)]++; return; }
  let h;
  if (mx===r) h=(g-b)/d; else if (mx===g) h=2+(b-r)/d; else h=4+(r-g)/d;
  h/=6; if(h<0)h+=1;
  sig[Math.min(SAT-1,((s-0.22)/0.78*SAT)|0)*HUE + Math.min(HUE-1,(h*HUE)|0)]++;
}
function sigNorm(s){ let t=0; for(let i=0;i<NBIN;i++) t+=s[i];
  if(t>0) for(let i=0;i<NBIN;i++) s[i]/=t; return t; }
function sigSim(a,b){ let s=0; for(let i=0;i<NBIN;i++) s+=Math.min(a[i],b[i]); return s; }

/* ================= 狀態 ================= */
const W=48, H=64, N=W*H;
const roiCv=document.createElement('canvas'); roiCv.width=W; roiCv.height=H;
const roiCtx=roiCv.getContext('2d',{willReadFrequently:true});

const video=document.getElementById('v');
const ovl=document.getElementById('ovl'), octx=ovl.getContext('2d');
const dbg=document.getElementById('dbg'); dbg.width=W; dbg.height=H;
const dctx=dbg.getContext('2d'); const dimg=dctx.createImageData(W,H);

const PALETTE=[[255,80,80],[80,170,255],[250,220,80],[170,120,255],[80,230,180],[255,150,60]];

let bg=null, bgFrames=0, learningBg=true;
let R={x:.50,w:.10,y:.50,h:.50};
let running=false, whiteCal=false, gain=[1,1,1];

let P={ fg:70, minArea:0.020, match:0.40, margin:0.06, minLap:2.0 };
const MISS_LIMIT=2;              // 連續幾幀沒對到就結束追蹤
const MIN_FRAMES=2;              // 追蹤至少要活這麼多幀才算數
const MAX_TRACK_LIFE=2.0;        // 秒，超過視為卡住
const MAX_MATCH_DIST=Math.hypot(W,H)*0.30;

const cars=[1,2,3,4].map(i=>({id:i,name:'#'+i,sig:null,thumb:null,
                              laps:0,last:0,best:0,lastT:0}));
let pendingEnroll=null;

/* 追蹤中的物體 */
let tracks=[], trackSeq=0;

let fps=0,fpsT=0,fpsN=0;
let calibrating=false, calUntil=0, calMaxArea=0;
let useWallClock=false, mtPrev=-1, mtStuck=0;

const S=document.getElementById('status'); const say=m=>S.innerHTML=m;
const EV=document.getElementById('evlog');
function ev(m){
  EV.innerHTML=`<div>${new Date().toLocaleTimeString('en-GB')} ${m}</div>`+EV.innerHTML;
  while(EV.children.length>40) EV.removeChild(EV.lastChild);
}

/* ================= 相機 ================= */
document.getElementById('btnCam').onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},
             height:{ideal:720},frameRate:{ideal:60}},audio:false});
    video.srcObject=stream; await video.play();
    for(const id of ['btnBg','btnWhite','btnCal']) document.getElementById(id).disabled=false;
    resetBg(); say('背景學習中，畫面請淨空'); ev('相機已開啟');
    video.requestVideoFrameCallback(onFrame);
  }catch(e){ say('相機開啟失敗：'+e.message+'（頁面必須用 https 開啟）'); }
};
function resetBg(){ bg=null; bgFrames=0; learningBg=true; tracks=[]; }
document.getElementById('btnBg').onclick=()=>{ resetBg(); say('背景重新學習中，畫面請淨空'); };
document.getElementById('btnWhite').onclick=e=>{
  whiteCal=!whiteCal; e.target.classList.toggle('on',whiteCal); resetBg();
  say(whiteCal?'白卡校正開啟 — 白紙要在畫面左側標記框內':'白卡校正關閉');
};
document.getElementById('btnCal').onclick=()=>{
  calibrating=true; calMaxArea=0; calUntil=performance.now()+8000;
  say('<b>校準中 8 秒</b> — 現在把車來回推過偵測框幾次'); ev('開始校準');
};
document.getElementById('btnStart').onclick=e=>{
  running=!running;
  if(running){ cars.forEach(c=>c.lastT=0);
    say('<b>計時中</b><br>第一次通過只記起點，第二次通過才有第一圈成績。'); ev('開始計時'); }
  else { say('計時已停止'); ev('停止計時'); }
  e.target.textContent=running?'停止計時':'開始計時';
  e.target.classList.toggle('run',running); render();
};
const refreshStart=()=>document.getElementById('btnStart').disabled=!cars.some(c=>c.sig);

/* ================= 連通區域切割 =================
   把前景遮罩切成互不相連的塊。兩台車並排 = 兩塊，
   各自帶自己的顏色直方圖，這是能分辨同時通過的關鍵。 */
const labels=new Int32Array(N);
const stack=new Int32Array(N);

function findBlobs(mask, buf, minArea){
  labels.fill(0);
  const out=[];
  let id=0;
  for(let i=0;i<N;i++){
    if(!mask[i]||labels[i]) continue;
    id++;
    let sp=0; stack[sp++]=i; labels[i]=id;
    let area=0, sx=0, sy=0;
    const sig=sigNew();
    let minx=W,maxx=0,miny=H,maxy=0;
    while(sp){
      const p=stack[--sp];
      const x=p%W, y=(p/W)|0;
      area++; sx+=x; sy+=y;
      if(x<minx)minx=x; if(x>maxx)maxx=x;
      if(y<miny)miny=y; if(y>maxy)maxy=y;
      sigAdd(sig, buf[p*3], buf[p*3+1], buf[p*3+2]);
      for(let dy=-1;dy<=1;dy++){
        const ny=y+dy; if(ny<0||ny>=H) continue;
        for(let dx=-1;dx<=1;dx++){
          const nx=x+dx; if(nx<0||nx>=W) continue;
          const q=ny*W+nx;
          if(mask[q]&&!labels[q]){ labels[q]=id; stack[sp++]=q; }
        }
      }
    }
    if(area>=minArea)
      out.push({area,cx:sx/area,cy:sy/area,sig,minx,maxx,miny,maxy,label:id});
    else
      for(let k=0;k<N;k++) if(labels[k]===id) labels[k]=0;   // 太小，抹掉
  }
  return out;
}

/* ================= 主迴圈 ================= */
function onFrame(now, meta){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw){ video.requestVideoFrameCallback(onFrame); return; }

  let t;
  if(!useWallClock){
    const mt=meta.mediaTime;
    if(mt===mtPrev){ if(++mtStuck>30){ useWallClock=true; ev('mediaTime 不前進，改用牆鐘'); } }
    else { mtStuck=0; mtPrev=mt; }
    t = useWallClock ? now/1000 : mt;
  } else t = now/1000;

  fpsN++;
  if(now-fpsT>500){ fps=fpsN*1000/(now-fpsT); fpsN=0; fpsT=now; }

  if(whiteCal){
    const rw=Math.max(8,vw*0.04);
    roiCtx.drawImage(video, 0.06*vw-rw/2, vh*0.45, rw, vh*0.1, 0,0,4,4);
    const rd=roiCtx.getImageData(0,0,4,4).data;
    let sr=0,sg=0,sb=0;
    for(let i=0;i<16;i++){ sr+=rd[i*4]; sg+=rd[i*4+1]; sb+=rd[i*4+2]; }
    const cl=x=>Math.max(0.5,Math.min(2.0,160/Math.max(20,x/16)));
    gain=[cl(sr),cl(sg),cl(sb)];
  } else gain=[1,1,1];

  const sx=(R.x-R.w/2)*vw, sw=R.w*vw, sy=(R.y-R.h/2)*vh, sh=R.h*vh;
  roiCtx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const px=roiCtx.getImageData(0,0,W,H).data;
  if(!bg) bg=new Float32Array(N*3);

  const buf=new Float32Array(N*3);
  for(let k=0;k<N;k++){
    buf[k*3]  =Math.min(255,px[k*4]  *gain[0]);
    buf[k*3+1]=Math.min(255,px[k*4+1]*gain[1]);
    buf[k*3+2]=Math.min(255,px[k*4+2]*gain[2]);
  }

  if(learningBg){
    const a=bgFrames===0?1:0.15;
    for(let k=0;k<N*3;k++) bg[k]=bg[k]*(1-a)+buf[k]*a;
    if(++bgFrames>=25){ learningBg=false; say('就緒 — 建議先按「自動校準」'); }
    paintDbg(buf,null,[]); updateMeter([]);
    video.requestVideoFrameCallback(onFrame); return;
  }

  /* --- 前景遮罩 --- */
  const mask=new Uint8Array(N);
  let fgN=0;
  for(let k=0;k<N;k++){
    const d=Math.abs(buf[k*3]-bg[k*3])+Math.abs(buf[k*3+1]-bg[k*3+1])
           +Math.abs(buf[k*3+2]-bg[k*3+2]);
    if(d>P.fg){ mask[k]=1; fgN++; }
  }

  const minArea=Math.max(4, P.minArea*N);
  const blobs=findBlobs(mask, buf, minArea);

  /* --- 校準：量最大車體 --- */
  if(calibrating){
    for(const b of blobs) if(b.area>calMaxArea) calMaxArea=b.area;
    if(now>calUntil){
      calibrating=false;
      if(calMaxArea<8){
        say('校準失敗：沒偵測到任何物體。<br>把框調到賽道上，或把「前景門檻」調低到 40。');
        ev(`校準失敗 最大塊=${calMaxArea}`);
      }else{
        P.minArea=Math.max(0.002,Math.min(0.30, calMaxArea/N*0.30));
        document.getElementById('pArea').value=Math.round(P.minArea*1000);
        document.getElementById('vArea').textContent=(P.minArea*100).toFixed(1)+'%';
        say(`校準完成：車體約 ${(calMaxArea/N*100).toFixed(1)}%，最小車體設為 ${(P.minArea*100).toFixed(1)}%`);
        ev(`校準完成 車體=${(calMaxArea/N*100).toFixed(1)}%`);
      }
    }
  }

  /* --- 沒有任何塊時才更新背景 --- */
  if(blobs.length===0)
    for(let k=0;k<N*3;k++) bg[k]=bg[k]*0.995+buf[k]*0.005;

  updateTracks(blobs, t);
  paintDbg(buf, mask, blobs);
  updateMeter(blobs, fgN);
  video.requestVideoFrameCallback(onFrame);
}

/* ================= 多物體追蹤 ================= */
function updateTracks(blobs, t){
  const used=new Array(blobs.length).fill(false);

  /* 每個既有追蹤找最近的一塊 */
  for(const tr of tracks){
    let bi=-1, bd=MAX_MATCH_DIST;
    for(let i=0;i<blobs.length;i++){
      if(used[i]) continue;
      const d=Math.hypot(blobs[i].cx-tr.cx, blobs[i].cy-tr.cy);
      if(d<bd){ bd=d; bi=i; }
    }
    if(bi>=0){
      used[bi]=true;
      const b=blobs[bi];
      tr.cx=b.cx; tr.cy=b.cy; tr.missed=0; tr.frames++;
      for(let i=0;i<NBIN;i++) tr.sig[i]+=b.sig[i];
      if(b.area>tr.peakArea){ tr.peakArea=b.area; tr.thumb=cropBlob(b); }
    } else tr.missed++;
  }

  /* 沒被認領的塊 -> 新追蹤 */
  for(let i=0;i<blobs.length;i++){
    if(used[i]) continue;
    const b=blobs[i];
    tracks.push({ tid:++trackSeq, cx:b.cx, cy:b.cy, entryT:t, frames:1,
                  missed:0, sig:Float32Array.from(b.sig),
                  peakArea:b.area, thumb:cropBlob(b) });
  }

  /* 結束的追蹤 */
  const alive=[];
  for(const tr of tracks){
    const expired = tr.missed>=MISS_LIMIT;
    const stuck = (t-tr.entryT)>MAX_TRACK_LIFE;
    if(expired||stuck){
      if(stuck && !expired) ev(`物體停留 ${(t-tr.entryT).toFixed(1)}s，丟棄`);
      else if(tr.frames>=MIN_FRAMES) finalize(tr);
      else ev(`物體只出現 ${tr.frames} 幀，太短，丟棄`);
    } else alive.push(tr);
  }
  tracks=alive;
}

function cropBlob(b){
  const pad=2;
  const x0=Math.max(0,b.minx-pad), y0=Math.max(0,b.miny-pad);
  const w=Math.min(W,b.maxx+pad)-x0, h=Math.min(H,b.maxy+pad)-y0;
  if(w<=0||h<=0) return null;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(roiCv, x0,y0,w,h, 0,0,w,h);
  return c.toDataURL('image/jpeg',0.7);
}

/* ================= 收尾比對 ================= */
function finalize(tr){
  const total=sigNorm(tr.sig);
  if(total<10){ ev(`前景太少 (${total|0})，丟棄`); return; }

  if(pendingEnroll!==null){
    const c=cars.find(c=>c.id===pendingEnroll);
    c.sig=Float32Array.from(tr.sig); c.thumb=tr.thumb;
    ev(`${c.name} 登錄完成 車體=${(tr.peakArea/N*100).toFixed(1)}%`);
    pendingEnroll=null; say(c.name+' 登錄完成');
    refreshStart(); render(); return;
  }

  let best=null,bestS=0,second=0;
  for(const c of cars){
    if(!c.sig) continue;
    const s=sigSim(tr.sig,c.sig);
    if(s>bestS){ second=bestS; bestS=s; best=c; }
    else if(s>second) second=s;
  }
  if(!best){ say('偵測到通過，但還沒登錄任何車'); return; }

  if(bestS<P.match||(bestS-second)<P.margin){
    ev(`認不出 最像=${best.name} ${bestS.toFixed(2)} 次高=${second.toFixed(2)}`);
    say(`有東西通過但認不出（最像 ${best.name}，${bestS.toFixed(2)}）`);
    return;
  }
  if(!running){
    ev(`${best.name} 通過 ${bestS.toFixed(2)}（未計時）`);
    say(`偵測到 ${best.name} — <b>尚未開始計時</b>`); return;
  }
  if(best.lastT===0){
    best.lastT=tr.entryT; ev(`${best.name} 起跑`);
    say(`${best.name} 起跑 — 下次通過就有第一圈成績`); render(); return;
  }
  const d=tr.entryT-best.lastT;
  if(d<P.minLap){ ev(`${best.name} 間隔 ${d.toFixed(2)}s 太短，略過`); return; }
  best.last=d;
  if(!best.best||d<best.best) best.best=d;
  best.laps++; best.lastT=tr.entryT;
  ev(`${best.name} 第${best.laps}圈 ${d.toFixed(3)}s`);
  say(`<b>${best.name}　${d.toFixed(3)}s</b>　第 ${best.laps} 圈`);
  render();
}

/* ================= 診斷 ================= */
function paintDbg(buf, mask, blobs){
  const d=dimg.data;
  for(let k=0;k<N;k++){
    const lab=mask?labels[k]:0;
    if(lab){
      const c=PALETTE[(lab-1)%PALETTE.length];
      d[k*4]=c[0]; d[k*4+1]=c[1]; d[k*4+2]=c[2];
    }else{
      const g=(buf[k*3]+buf[k*3+1]+buf[k*3+2])/3*0.5;
      d[k*4]=d[k*4+1]=d[k*4+2]=g;
    }
    d[k*4+3]=255;
  }
  dctx.putImageData(dimg,0,0);
}

function updateMeter(blobs, fgN=0){
  document.getElementById('nums').innerHTML =
    `偵測到 <b>${blobs.length}</b> 個物體　前景 ${(fgN/N*100).toFixed(1)}%<br>`+
    `最小車體 ${(P.minArea*100).toFixed(1)}%　追蹤中 ${tracks.length}　${fps.toFixed(0)} fps`+
    (useWallClock?'　<span style="color:#facc15">牆鐘</span>':'');
  document.getElementById('blobs').innerHTML = blobs.map((b,i)=>{
    const c=PALETTE[(b.label-1)%PALETTE.length];
    return `<span style="color:rgb(${c})">■</span> ${(b.area/N*100).toFixed(1)}%`;
  }).join('　');
  drawOvl(blobs.length>0);
}

function drawOvl(hot){
  const r=video.getBoundingClientRect();
  if(ovl.width!==r.width||ovl.height!==r.height){ ovl.width=r.width; ovl.height=r.height; }
  octx.clearRect(0,0,ovl.width,ovl.height);
  const x=(R.x-R.w/2)*ovl.width, w=R.w*ovl.width;
  const y=(R.y-R.h/2)*ovl.height, h=R.h*ovl.height;
  octx.fillStyle = hot?'rgba(239,68,68,.28)'
                 :(running?'rgba(74,222,128,.16)':'rgba(160,160,160,.12)');
  octx.fillRect(x,y,w,h);
  octx.strokeStyle=hot?'#ef4444':'#4ade80'; octx.lineWidth=2;
  octx.strokeRect(x,y,w,h);
  if(whiteCal){
    const rw=Math.max(10,ovl.width*0.04);
    octx.strokeStyle='#fff';
    octx.strokeRect(0.06*ovl.width-rw/2, ovl.height*0.45, rw, ovl.height*0.1);
  }
}

/* ================= UI ================= */
function render(){
  document.getElementById('enroll').innerHTML=cars.map(c=>
    `<button onclick="enroll(${c.id})">${c.sig?'重登 ':'登錄 '}${c.name}</button>`).join('');
  document.getElementById('tbl').innerHTML=cars.map(c=>{
    let lap;
    if(!c.sig) lap='<span class="wait">未登錄</span>';
    else if(running&&c.lastT===0) lap='<span class="wait">待起跑</span>';
    else lap=c.laps;
    return `<tr><td>${c.name}</td>
      <td>${c.thumb?`<img class="thumb" src="${c.thumb}">`:'<span class="thumb"></span>'}</td>
      <td>${lap}</td><td>${c.last?c.last.toFixed(3):'--'}</td>
      <td class="best">${c.best?c.best.toFixed(3):'--'}</td></tr>`;
  }).join('');
}
window.enroll=id=>{ pendingEnroll=id; say(`請讓 #${id} 單獨通過偵測框`); ev(`等待登錄 #${id}`); };
document.getElementById('btnReset').onclick=()=>{
  cars.forEach(c=>{c.laps=0;c.last=0;c.best=0;c.lastT=0;});
  render(); say('成績已歸零'); ev('成績歸零');
};

const bindR=(id,vid,key)=>{
  const el=document.getElementById(id), lb=document.getElementById(vid);
  el.oninput=()=>{ R[key]=+el.value/100; lb.textContent=el.value; resetBg(); };
};
bindR('rX','vX','x'); bindR('rW','vW','w'); bindR('rY','vY','y'); bindR('rH','vH','h');

const bindP=(id,vid,fn,fmt)=>{
  const el=document.getElementById(id), lb=document.getElementById(vid);
  el.oninput=()=>{ fn(+el.value); lb.textContent=fmt(+el.value); };
  lb.textContent=fmt(+el.value);
};
bindP('pFg','vFg',    v=>P.fg=v,          v=>v);
bindP('pArea','vArea',v=>P.minArea=v/1000,v=>(v/10).toFixed(1)+'%');
bindP('pMat','vMat',  v=>P.match=v/100,   v=>(v/100).toFixed(2));
bindP('pLap','vLap',  v=>P.minLap=v/10,   v=>(v/10).toFixed(1)+'s');

render(); refreshStart();
</script>
