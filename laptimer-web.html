<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>圈速計 v3</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b0c;color:#eee;font-family:-apple-system,system-ui,sans-serif;
       -webkit-user-select:none;user-select:none}
  #stage{position:relative;width:100%;background:#000;overflow:hidden}
  video{width:100%;display:block}
  #ovl{position:absolute;inset:0;width:100%;height:100%}
  .panel{padding:12px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  button{background:#26262b;color:#eee;border:1px solid #3a3a42;border-radius:8px;
         padding:9px 14px;font-size:15px}
  button.on{background:#2563eb;border-color:#2563eb}
  button.run{background:#dc2626;border-color:#dc2626}
  button:disabled{opacity:.4}
  #btnStart{font-size:17px;font-weight:600;padding:13px 22px;flex:1}
  #btnCal{background:#7c3aed;border-color:#7c3aed}
  input[type=range]{flex:1;min-width:110px}
  label{font-size:12px;color:#999;min-width:70px}
  .val{font-size:12px;color:#bbb;min-width:44px;text-align:right}
  table{width:100%;border-collapse:collapse;font-size:16px;margin-top:6px}
  th,td{padding:8px 4px;border-bottom:1px solid #26262b;text-align:right}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  th{font-size:12px;color:#888;font-weight:500}
  .best{color:#4ade80}
  .wait{color:#facc15;font-size:13px}
  .thumb{width:34px;height:34px;object-fit:cover;border-radius:5px;background:#26262b;
         vertical-align:middle;display:inline-block}
  #status{font-size:14px;color:#ddd;padding:10px 12px;background:#161619;border-radius:8px;
          margin:0 12px;line-height:1.45}
  h3{font-size:14px;color:#888;font-weight:600;margin:18px 0 6px;
     text-transform:uppercase;letter-spacing:.05em}
  .hint{font-size:12px;color:#777;line-height:1.5;margin:4px 0 10px}

  /* 診斷區 */
  #diagBox{display:flex;gap:12px;align-items:flex-start;background:#141418;
           border:1px solid #26262b;border-radius:8px;padding:10px;margin-bottom:10px}
  #dbg{width:56px;height:112px;image-rendering:pixelated;border:1px solid #3a3a42;
       border-radius:4px;background:#000;flex-shrink:0}
  #meter{flex:1}
  .bar{position:relative;height:22px;background:#26262b;border-radius:4px;overflow:hidden;
       margin:6px 0}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:#4ade80;transition:width .05s}
  .bar i.hot{background:#ef4444}
  .bar u{position:absolute;top:0;bottom:0;width:2px;background:#facc15}
  .nums{font-size:12px;color:#aaa;font-variant-numeric:tabular-nums;line-height:1.6}
  #evlog{font-size:11px;color:#888;font-family:ui-monospace,monospace;line-height:1.6;
         max-height:110px;overflow-y:auto;margin-top:6px}
</style>
</head>
<body>

<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="ovl"></canvas>
</div>

<div id="status">按「開啟相機」開始</div>

<div class="panel">

  <div class="row">
    <button id="btnCam">開啟相機</button>
    <button id="btnBg" disabled>重學背景</button>
    <button id="btnWhite" disabled>白卡校正</button>
  </div>

  <!-- 診斷：這裡看得到偵測器眼中的世界 -->
  <div id="diagBox">
    <canvas id="dbg"></canvas>
    <div id="meter">
      <div class="bar"><i id="barFill"></i><u id="barMark"></u></div>
      <div class="nums" id="nums">尚未啟動</div>
    </div>
  </div>

  <div class="row">
    <button id="btnCal" disabled>自動校準門檻</button>
  </div>
  <div class="hint">按下後有 8 秒，把車來回推過偵測框幾次，程式會自己抓出合適的門檻。</div>

  <div class="row">
    <button id="btnStart" disabled>開始計時</button>
  </div>

  <h3>偵測框位置</h3>
  <div class="row"><label>左右</label><input type="range" id="rX" min="3" max="97" value="50"><span class="val" id="vX">50</span></div>
  <div class="row"><label>寬度</label><input type="range" id="rW" min="2" max="40" value="8"><span class="val" id="vW">8</span></div>
  <div class="row"><label>上下</label><input type="range" id="rY" min="3" max="97" value="50"><span class="val" id="vY">50</span></div>
  <div class="row"><label>高度</label><input type="range" id="rH" min="5" max="100" value="45"><span class="val" id="vH">45</span></div>
  <div class="hint">把框調到剛好蓋住賽道那一段就好。框越貼近賽道，車子佔的比例越大，越容易偵測。</div>

  <h3>登錄車輛</h3>
  <div class="hint">按下按鈕後，把車放進框內推過去一次。登錄時允許慢慢推，不會超時。</div>
  <div class="row" id="enroll"></div>

  <h3>成績</h3>
  <table>
    <thead><tr><th>車</th><th></th><th>圈</th><th>本圈</th><th>最快</th></tr></thead>
    <tbody id="tbl"></tbody>
  </table>
  <div class="row" style="margin-top:12px">
    <button id="btnReset">成績歸零</button>
  </div>

  <h3>事件記錄</h3>
  <div id="evlog"></div>

  <h3>參數</h3>
  <div class="row"><label>前景門檻</label><input type="range" id="pFg" min="20" max="200" value="70"><span class="val" id="vFg">70</span></div>
  <div class="row"><label>佔用門檻</label><input type="range" id="pOcc" min="2" max="300" value="25"><span class="val" id="vOcc">2.5%</span></div>
  <div class="row"><label>相似度門檻</label><input type="range" id="pMat" min="20" max="80" value="40"><span class="val" id="vMat">0.40</span></div>
  <div class="row"><label>最短圈速</label><input type="range" id="pLap" min="5" max="60" value="20"><span class="val" id="vLap">2.0s</span></div>

</div>

<script>
'use strict';

/* ============ 顏色指紋 ============ */
const HUE = 16, SAT = 2, ACHRO = 4, NBIN = HUE * SAT + ACHRO;
const sigNew = () => new Float32Array(NBIN);

function sigAdd(sig, r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  const s = mx > 0.004 ? d / mx : 0;
  if (s < 0.22) { sig[HUE*SAT + Math.min(ACHRO-1, (mx*ACHRO)|0)]++; return; }
  let h;
  if (mx === r) h = (g - b) / d;
  else if (mx === g) h = 2 + (b - r) / d;
  else h = 4 + (r - g) / d;
  h /= 6; if (h < 0) h += 1;
  sig[Math.min(SAT-1, ((s-0.22)/0.78*SAT)|0) * HUE + Math.min(HUE-1, (h*HUE)|0)]++;
}
function sigNorm(sig) {
  let t = 0; for (let i = 0; i < NBIN; i++) t += sig[i];
  if (t > 0) for (let i = 0; i < NBIN; i++) sig[i] /= t;
  return t;
}
function sigSim(a, b) {
  let s = 0; for (let i = 0; i < NBIN; i++) s += Math.min(a[i], b[i]);
  return s;
}

/* ============ 狀態 ============ */
const W = 32, H = 64;
const roiCv = document.createElement('canvas'); roiCv.width = W; roiCv.height = H;
const roiCtx = roiCv.getContext('2d', { willReadFrequently: true });

const video = document.getElementById('v');
const ovl = document.getElementById('ovl'), octx = ovl.getContext('2d');
const dbg = document.getElementById('dbg'); dbg.width = W; dbg.height = H;
const dctx = dbg.getContext('2d');
const dimg = dctx.createImageData(W, H);

let bg = null, bgFrames = 0, learningBg = true;
let R = { x: 0.50, w: 0.08, y: 0.50, h: 0.45 };
let running = false;

let inPass = false, entryT = 0, passSig = sigNew(), clearN = 0;
let peakFg = 0, peakURL = null, passPeakOcc = 0;

let P = { fg: 70, occ: 0.025, match: 0.40, margin: 0.06, minLap: 2.0 };
const CLEAR_NEEDED = 2, MAX_PASS = 1.5, MAX_PASS_ENROLL = 8.0;

const cars = [1,2,3,4].map(i => ({ id:i, name:'#'+i, sig:null, thumb:null,
                                   laps:0, last:0, best:0, lastT:0 }));
let pendingEnroll = null;

let fps = 0, fpsT = 0, fpsN = 0;
let occNow = 0, occPeak = 0, occPeakT = 0;
let calibrating = false, calUntil = 0, calMax = 0;

/* 時間來源：mediaTime 若不前進就退回牆鐘 */
let useWallClock = false, mtPrev = -1, mtStuck = 0;

const S = document.getElementById('status');
const say = m => S.innerHTML = m;
const EV = document.getElementById('evlog');
function ev(m) {
  EV.innerHTML = `<div>${new Date().toLocaleTimeString('en-GB')} ${m}</div>` + EV.innerHTML;
  if (EV.children.length > 40) EV.removeChild(EV.lastChild);
}

/* ============ 相機 ============ */
document.getElementById('btnCam').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ideal:'environment'}, width:{ideal:1280},
               height:{ideal:720}, frameRate:{ideal:60} }, audio:false });
    video.srcObject = stream;
    await video.play();
    for (const id of ['btnBg','btnWhite','btnCal']) document.getElementById(id).disabled = false;
    resetBg();
    say('背景學習中，畫面請淨空');
    ev('相機已開啟');
    video.requestVideoFrameCallback(onFrame);
  } catch (e) {
    say('相機開啟失敗：' + e.message + '（頁面必須用 https 開啟）');
  }
};

function resetBg(){ bg = null; bgFrames = 0; learningBg = true; inPass = false; }
document.getElementById('btnBg').onclick = () => { resetBg(); say('背景重新學習中，畫面請淨空'); };

let whiteCal = false, gain = [1,1,1];
document.getElementById('btnWhite').onclick = e => {
  whiteCal = !whiteCal;
  e.target.classList.toggle('on', whiteCal);
  resetBg();
  say(whiteCal ? '白卡校正開啟 — 白紙要在畫面左側標記框內' : '白卡校正關閉');
};

/* ============ 自動校準 ============ */
document.getElementById('btnCal').onclick = () => {
  calibrating = true; calMax = 0; calUntil = performance.now() + 8000;
  say('<b>校準中 8 秒</b> — 現在把車來回推過偵測框幾次');
  ev('開始自動校準');
};

/* ============ 開始 / 停止 ============ */
document.getElementById('btnStart').onclick = e => {
  running = !running;
  if (running) {
    cars.forEach(c => c.lastT = 0);
    say('<b>計時中</b><br>第一次通過只記起點，第二次通過才有第一圈成績。');
    ev('開始計時');
  } else { say('計時已停止'); ev('停止計時'); }
  e.target.textContent = running ? '停止計時' : '開始計時';
  e.target.classList.toggle('run', running);
  render();
};
const refreshStart = () =>
  document.getElementById('btnStart').disabled = !cars.some(c => c.sig);

/* ============ 主迴圈 ============ */
function onFrame(now, meta) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) { video.requestVideoFrameCallback(onFrame); return; }

  /* 時間戳 */
  let t;
  if (!useWallClock) {
    const mt = meta.mediaTime;
    if (mt === mtPrev) { if (++mtStuck > 30) { useWallClock = true; ev('mediaTime 不前進，改用牆鐘'); } }
    else { mtStuck = 0; mtPrev = mt; }
    t = useWallClock ? now / 1000 : mt;
  } else t = now / 1000;

  fpsN++;
  if (now - fpsT > 500) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }

  /* 白卡 */
  if (whiteCal) {
    const rw = Math.max(8, vw * 0.04);
    roiCtx.drawImage(video, 0.06*vw - rw/2, vh*0.45, rw, vh*0.1, 0, 0, 4, 4);
    const rd = roiCtx.getImageData(0,0,4,4).data;
    let sr=0,sg=0,sb=0;
    for (let i=0;i<16;i++){ sr+=rd[i*4]; sg+=rd[i*4+1]; sb+=rd[i*4+2]; }
    const cl = x => Math.max(0.5, Math.min(2.0, 160 / Math.max(20, x/16)));
    gain = [cl(sr), cl(sg), cl(sb)];
  } else gain = [1,1,1];

  /* 取偵測框 */
  const sx = (R.x - R.w/2) * vw, sw = R.w * vw;
  const sy = (R.y - R.h/2) * vh, sh = R.h * vh;
  roiCtx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const px = roiCtx.getImageData(0, 0, W, H).data;
  const n = W * H;
  if (!bg) bg = new Float32Array(n * 3);

  const buf = new Float32Array(n * 3);
  for (let k = 0; k < n; k++) {
    buf[k*3]   = Math.min(255, px[k*4]   * gain[0]);
    buf[k*3+1] = Math.min(255, px[k*4+1] * gain[1]);
    buf[k*3+2] = Math.min(255, px[k*4+2] * gain[2]);
  }

  /* 背景學習 */
  if (learningBg) {
    const a = bgFrames === 0 ? 1 : 0.15;
    for (let k = 0; k < n*3; k++) bg[k] = bg[k]*(1-a) + buf[k]*a;
    if (++bgFrames >= 25) { learningBg = false; say('就緒 — 建議先按「自動校準門檻」'); }
    paintDbg(buf, null, n);
    updateMeter(0);
    video.requestVideoFrameCallback(onFrame);
    return;
  }

  /* 前景 */
  const fgMask = new Uint8Array(n);
  let fgN = 0;
  const fsig = sigNew();
  for (let k = 0; k < n; k++) {
    const d = Math.abs(buf[k*3]-bg[k*3]) + Math.abs(buf[k*3+1]-bg[k*3+1])
            + Math.abs(buf[k*3+2]-bg[k*3+2]);
    if (d > P.fg) {
      fgMask[k] = 1; fgN++;
      sigAdd(fsig, buf[k*3], buf[k*3+1], buf[k*3+2]);
    }
  }
  occNow = fgN / n;
  if (occNow > occPeak || now - occPeakT > 3000) { occPeak = occNow; occPeakT = now; }

  /* 校準 */
  if (calibrating) {
    if (occNow > calMax) calMax = occNow;
    if (now > calUntil) {
      calibrating = false;
      if (calMax < 0.005) {
        say('校準失敗：完全沒偵測到變化。<br>把偵測框調到賽道上，或把「前景門檻」調低。');
        ev(`校準失敗 峰值=${(calMax*100).toFixed(1)}%`);
      } else {
        P.occ = Math.max(0.004, Math.min(0.30, calMax * 0.40));
        document.getElementById('pOcc').value = Math.round(P.occ * 1000);
        document.getElementById('vOcc').textContent = (P.occ*100).toFixed(1) + '%';
        say(`校準完成：車子峰值 ${(calMax*100).toFixed(1)}%，門檻設為 ${(P.occ*100).toFixed(1)}%`);
        ev(`校準完成 峰值=${(calMax*100).toFixed(1)}% 門檻=${(P.occ*100).toFixed(1)}%`);
      }
    }
  }

  const present = occNow > P.occ;

  /* 狀態機 */
  if (!inPass && present) {
    inPass = true; entryT = t; passSig = sigNew();
    clearN = 0; peakFg = 0; peakURL = null; passPeakOcc = 0;
  } else if (!inPass) {
    for (let k = 0; k < n*3; k++) bg[k] = bg[k]*0.995 + buf[k]*0.005;
  }

  if (inPass) {
    if (present) {
      clearN = 0;
      for (let i = 0; i < NBIN; i++) passSig[i] += fsig[i];
      if (occNow > passPeakOcc) passPeakOcc = occNow;
      if (fgN > peakFg) { peakFg = fgN; peakURL = roiCv.toDataURL('image/jpeg', 0.6); }
    } else clearN++;

    const limit = pendingEnroll !== null ? MAX_PASS_ENROLL : MAX_PASS;
    const tooLong = (t - entryT) > limit;
    if (clearN >= CLEAR_NEEDED || tooLong) {
      inPass = false;
      if (tooLong) ev(`通過超時 ${(t-entryT).toFixed(1)}s，丟棄`);
      else finalize(entryT);
    }
  }

  paintDbg(buf, fgMask, n);
  updateMeter(occNow);
  video.requestVideoFrameCallback(onFrame);
}

/* ============ 收尾 ============ */
function finalize(t) {
  const total = sigNorm(passSig);
  if (total < 10) { ev(`前景太少 (${total|0} 點)，丟棄`); return; }

  if (pendingEnroll !== null) {
    const c = cars.find(c => c.id === pendingEnroll);
    c.sig = Float32Array.from(passSig); c.thumb = peakURL;
    ev(`${c.name} 登錄完成 峰值=${(passPeakOcc*100).toFixed(1)}%`);
    pendingEnroll = null;
    say(c.name + ' 登錄完成');
    refreshStart(); render();
    return;
  }

  let best = null, bestS = 0, second = 0;
  for (const c of cars) {
    if (!c.sig) continue;
    const s = sigSim(passSig, c.sig);
    if (s > bestS) { second = bestS; bestS = s; best = c; }
    else if (s > second) second = s;
  }

  if (!best) { ev('有通過，但還沒登錄任何車'); say('偵測到通過，但還沒登錄任何車'); return; }

  if (bestS < P.match || (bestS - second) < P.margin) {
    ev(`認不出 最像=${best.name} ${bestS.toFixed(2)} 次高=${second.toFixed(2)}`);
    say(`有東西通過，但認不出（最像 ${best.name}，相似度 ${bestS.toFixed(2)}）`);
    return;
  }

  if (!running) {
    ev(`${best.name} 通過 ${bestS.toFixed(2)}（未計時）`);
    say(`偵測到 ${best.name} — <b>尚未開始計時</b>，按「開始計時」才會記錄`);
    return;
  }

  if (best.lastT === 0) {
    best.lastT = t;
    ev(`${best.name} 起跑`);
    say(`${best.name} 起跑 — 下次通過就有第一圈成績`);
    render(); return;
  }

  const d = t - best.lastT;
  if (d < P.minLap) { ev(`${best.name} 間隔 ${d.toFixed(2)}s 太短，略過`); return; }
  best.last = d;
  if (!best.best || d < best.best) best.best = d;
  best.laps++; best.lastT = t;
  ev(`${best.name} 第${best.laps}圈 ${d.toFixed(3)}s`);
  say(`<b>${best.name}　${d.toFixed(3)}s</b>　第 ${best.laps} 圈`);
  render();
}

/* ============ 診斷畫面 ============ */
function paintDbg(buf, mask, n) {
  const d = dimg.data;
  for (let k = 0; k < n; k++) {
    if (mask && mask[k]) {
      d[k*4] = 255; d[k*4+1] = 60; d[k*4+2] = 60;
    } else {
      const g = (buf[k*3] + buf[k*3+1] + buf[k*3+2]) / 3 * 0.55;
      d[k*4] = d[k*4+1] = d[k*4+2] = g;
    }
    d[k*4+3] = 255;
  }
  dctx.putImageData(dimg, 0, 0);
}

function updateMeter(occ) {
  const scale = Math.max(P.occ * 3, 0.08);
  const f = document.getElementById('barFill');
  f.style.width = Math.min(100, occ / scale * 100) + '%';
  f.classList.toggle('hot', occ > P.occ);
  document.getElementById('barMark').style.left =
    Math.min(99, P.occ / scale * 100) + '%';
  document.getElementById('nums').innerHTML =
    `佔用 <b>${(occ*100).toFixed(1)}%</b>　門檻 ${(P.occ*100).toFixed(1)}%<br>` +
    `3秒峰值 ${(occPeak*100).toFixed(1)}%　${fps.toFixed(0)} fps` +
    (useWallClock ? '　<span style="color:#facc15">牆鐘</span>' : '');
  drawOvl(occ);
}

function drawOvl(occ) {
  const r = video.getBoundingClientRect();
  if (ovl.width !== r.width || ovl.height !== r.height) {
    ovl.width = r.width; ovl.height = r.height;
  }
  octx.clearRect(0, 0, ovl.width, ovl.height);
  const x = (R.x - R.w/2) * ovl.width, w = R.w * ovl.width;
  const y = (R.y - R.h/2) * ovl.height, h = R.h * ovl.height;
  octx.fillStyle = occ > P.occ ? 'rgba(239,68,68,.30)'
                 : (running ? 'rgba(74,222,128,.18)' : 'rgba(160,160,160,.14)');
  octx.fillRect(x, y, w, h);
  octx.strokeStyle = occ > P.occ ? '#ef4444' : '#4ade80';
  octx.lineWidth = 2; octx.strokeRect(x, y, w, h);
  if (whiteCal) {
    const rw = Math.max(10, ovl.width * 0.04);
    octx.strokeStyle = '#fff';
    octx.strokeRect(0.06*ovl.width - rw/2, ovl.height*0.45, rw, ovl.height*0.1);
  }
}

/* ============ UI ============ */
function render() {
  document.getElementById('enroll').innerHTML = cars.map(c =>
    `<button onclick="enroll(${c.id})">${c.sig?'重登 ':'登錄 '}${c.name}</button>`).join('');
  document.getElementById('tbl').innerHTML = cars.map(c => {
    let lap;
    if (!c.sig) lap = '<span class="wait">未登錄</span>';
    else if (running && c.lastT === 0) lap = '<span class="wait">待起跑</span>';
    else lap = c.laps;
    return `<tr><td>${c.name}</td>
      <td>${c.thumb?`<img class="thumb" src="${c.thumb}">`:'<span class="thumb"></span>'}</td>
      <td>${lap}</td><td>${c.last?c.last.toFixed(3):'--'}</td>
      <td class="best">${c.best?c.best.toFixed(3):'--'}</td></tr>`;
  }).join('');
}
window.enroll = id => { pendingEnroll = id; say(`請讓 #${id} 通過偵測框`); ev(`等待登錄 #${id}`); };

document.getElementById('btnReset').onclick = () => {
  cars.forEach(c => { c.laps=0; c.last=0; c.best=0; c.lastT=0; });
  render(); say('成績已歸零'); ev('成績歸零');
};

const bindR = (id, vid, key, fmt) => {
  const el = document.getElementById(id), lb = document.getElementById(vid);
  el.oninput = () => { R[key] = +el.value/100; lb.textContent = el.value; resetBg(); };
};
bindR('rX','vX','x'); bindR('rW','vW','w'); bindR('rY','vY','y'); bindR('rH','vH','h');

const bindP = (id, vid, fn, fmt) => {
  const el = document.getElementById(id), lb = document.getElementById(vid);
  el.oninput = () => { fn(+el.value); lb.textContent = fmt(+el.value); };
  lb.textContent = fmt(+el.value);
};
bindP('pFg','vFg',  v => P.fg = v,           v => v);
bindP('pOcc','vOcc',v => P.occ = v/1000,     v => (v/10).toFixed(1)+'%');
bindP('pMat','vMat',v => P.match = v/100,    v => (v/100).toFixed(2));
bindP('pLap','vLap',v => P.minLap = v/10,    v => (v/10).toFixed(1)+'s');

render(); refreshStart();
</script>
</body>
</html>
